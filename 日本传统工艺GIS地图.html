<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本传统工艺综合档案 ｜ Traditional Crafts of Japan</title>
<style>
  :root{
    --paper:#f7f6f2;--ink:#36352f;--ink-soft:#7d786e;--line:#d8d4c8;
    --region:#eceae3;--region-stroke:#cdc8bb;--region-active:#e2ded1;
    --accent:#b14b3e;--accent-soft:#c9766b;--card:#ffffff;--card-border:#e7e3d8;
    --shadow:0 1px 3px rgba(54,53,47,.06),0 8px 24px rgba(54,53,47,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Hiragino Mincho ProN","Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
    color:var(--ink);background:var(--paper);line-height:1.7;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 28px 60px}
  header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  header.top .titles .zh{font-size:24px;letter-spacing:.06em;font-weight:600}
  header.top .titles .en{font-size:12px;color:var(--ink-soft);letter-spacing:.16em;text-transform:uppercase;margin-top:4px}
  header.top .titles .ja{font-size:12px;color:var(--ink-soft);letter-spacing:.1em;margin-top:1px}
  .lang-switch{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;flex-shrink:0}
  .lang-switch button{background:transparent;border:none;border-left:1px solid var(--line);padding:8px 14px;
    font-family:inherit;font-size:13px;color:var(--ink-soft);cursor:pointer;transition:all .2s;letter-spacing:.04em}
  .lang-switch button:first-child{border-left:none}
  .lang-switch button:hover{color:var(--ink)}
  .lang-switch button.active{background:var(--ink);color:#fff}
  header.top .rule{height:1px;background:var(--line);margin-top:16px}

  .tabs{display:flex;gap:4px;margin:22px 0 18px;flex-wrap:wrap}
  .tab{padding:9px 20px;border:1px solid var(--line);border-bottom:none;border-radius:4px 4px 0 0;
    background:var(--paper);font-family:inherit;font-size:14px;color:var(--ink-soft);cursor:pointer;transition:all .2s;letter-spacing:.04em}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--card);color:var(--accent);border-color:var(--card-border);box-shadow:0 -1px 0 var(--accent)}
  .view{background:var(--card);border:1px solid var(--card-border);border-radius:0 4px 4px 4px;padding:22px;box-shadow:var(--shadow)}
  .view.hidden{display:none}

  /* MAP */
  .layout{display:flex;gap:28px;align-items:flex-start}
  .map-col{flex:1 1 54%;min-width:0}
  .panel-col{flex:1 1 46%;min-width:0}
  svg.map{width:100%;height:auto;display:block}
  .region-shape{fill:var(--region);stroke:var(--region-stroke);stroke-width:1.2;cursor:pointer;transition:fill .25s,stroke .25s}
  .region-shape:hover{fill:var(--region-active)}
  .region-shape.active{fill:var(--region-active);stroke:var(--accent-soft);stroke-width:1.6}
  .region-shape.dim{opacity:.4}
  .region-label{font-size:14px;fill:var(--ink);text-anchor:middle;pointer-events:none;letter-spacing:.04em}
  .marker{fill:var(--accent);stroke:#fff;stroke-width:1.4;cursor:pointer;transition:r .2s,fill .2s}
  .marker:hover{r:9;fill:var(--accent-soft)}
  .marker.active{r:9;fill:var(--accent)}
  .marker.dim{opacity:.25}
  .count{font-size:9px;fill:#fff;text-anchor:middle;pointer-events:none;font-family:Georgia,serif}
  .search{width:100%;padding:10px 14px;border:1px solid var(--card-border);border-radius:2px;background:var(--paper);
    font-family:inherit;font-size:14px;color:var(--ink);outline:none}
  .search:focus{border-color:var(--accent-soft)}
  .axis{margin-top:13px}
  .axis-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:5px 11px;border:1px solid var(--line);border-radius:18px;font-size:12px;color:var(--ink-soft);
    cursor:pointer;background:transparent;transition:all .2s;letter-spacing:.03em}
  .chip:hover{border-color:var(--accent-soft);color:var(--ink)}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.artisan{border-style:dashed}
  .chip.artisan.active{background:var(--accent);border-color:var(--accent)}
  .banner{margin:14px 0 4px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--paper);
    font-size:13px;border-radius:0 3px 3px 0}
  .banner b{color:var(--accent)}
  .banner .x{float:right;cursor:pointer;color:var(--ink-soft);font-size:12px;border:1px solid var(--line);
    border-radius:10px;padding:0 8px;line-height:18px}
  .banner .x:hover{color:var(--accent);border-color:var(--accent)}
  .meta-line{font-size:12px;color:var(--ink-soft);margin:14px 2px 8px;letter-spacing:.04em}
  .meta-line b{color:var(--accent);font-weight:600}
  .list{display:flex;flex-direction:column;gap:10px}
  .craft{background:var(--paper);border:1px solid var(--card-border);border-radius:3px;padding:13px 15px;cursor:pointer;
    transition:box-shadow .2s,transform .2s}
  .craft:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .craft .name{font-size:16px;font-weight:600;letter-spacing:.03em}
  .craft .tag{display:inline-block;font-size:11px;color:var(--accent);border:1px solid var(--line);border-radius:2px;
    padding:1px 8px;margin-top:7px;letter-spacing:.05em}
  .craft .tag.loc{color:var(--ink-soft);margin-left:6px}
  .craft .detail{max-height:0;overflow:hidden;transition:max-height .35s ease;color:var(--ink-soft);font-size:13.5px}
  .craft.open .detail{max-height:340px;margin-top:9px}
  .craft .art{margin-top:8px;font-size:12.5px;color:var(--ink-soft)}
  .craft .art .nm{color:var(--accent);cursor:pointer;border-bottom:1px dotted var(--accent-soft)}
  .craft .art .nm:hover{color:var(--accent-soft)}
  .craft .bio{margin-top:7px;font-size:12.5px;color:var(--accent);font-style:italic}
  .empty{color:var(--ink-soft);font-size:13px;padding:20px;text-align:center}

  /* DATABASE */
  .db-note{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;line-height:1.8}
  table.db{width:100%;border-collapse:collapse;font-size:13px}
  table.db th,table.db td{border:1px solid var(--card-border);padding:8px 10px;text-align:left;vertical-align:top}
  table.db th{background:var(--paper);color:var(--ink-soft);font-weight:600;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;position:sticky;top:0}
  table.db tbody tr:hover{background:var(--paper)}
  table.db td.no{color:var(--ink-soft);text-align:center;width:42px;font-family:Georgia,serif}
  table.db td.name{font-weight:600}
  .db-scroll{max-height:62vh;overflow:auto;border:1px solid var(--card-border);border-radius:3px}
  table.db{font-size:12.5px}

  /* ARTISANS */
  .art-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:6px}
  .acard{background:var(--paper);border:1px solid var(--card-border);border-radius:4px;padding:14px 15px;cursor:pointer;transition:box-shadow .2s,transform .2s}
  .acard:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .acard .ahead{display:flex;align-items:flex-start;gap:9px;cursor:pointer}
  .acard .ainfo{flex:1;min-width:0}
  .acard .nm{font-size:15.5px;font-weight:600}
  .acard .sp{font-size:12.5px;color:var(--accent);margin-top:4px}
  .acard .meta{font-size:12px;color:var(--ink-soft);margin-top:7px}
  .acard .yr{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:2px;padding:0 7px;margin-top:8px;color:var(--ink-soft)}
  .acard .yr.grp{color:var(--accent);border-color:var(--accent-soft)}
  .acard .toggle{flex:none;font-size:18px;color:var(--accent);line-height:1.1;user-select:none;transition:transform .2s;margin-top:-1px}
  .acard.open .toggle{transform:rotate(45deg)}
  .acard .abody{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:11px}
  .acard.open .abody{display:block}
  .acard .sec{margin-bottom:11px}
  .acard .lab{display:inline-block;font-size:11px;letter-spacing:.08em;color:var(--accent);border:1px solid var(--accent-soft);border-radius:2px;padding:1px 7px;margin-bottom:5px}
  .acard .sec p{margin:0;font-size:12.5px;line-height:1.74;color:var(--ink-soft)}
  .acard .locbtn{margin-top:2px;font-size:11.5px;color:var(--accent);background:var(--accent-soft);border:none;border-radius:2px;padding:4px 12px;cursor:pointer;transition:background .2s,color .2s}
  .acard .locbtn:hover{background:var(--accent);color:#fff}

  footer{margin-top:34px;font-size:11px;color:#a8a296;letter-spacing:.06em;text-align:center;line-height:1.8}
  @media (max-width:860px){.layout{flex-direction:column}.map-col{width:100%}.panel-col{width:100%}}
</style>
</head>
<body>

        <div class="meta-line" id="meta"></div>
        <div class="list" id="list"></div>
      </div>
    </div>
  </div>

  <!-- VIEW: DATABASE -->
  <div class="view hidden" id="view-db">
    <div class="db-note" id="db-note"></div>
    <input class="search" id="db-search" type="text" style="margin-bottom:12px">
    <div class="db-scroll">

      </table>

  <!-- VIEW: ARTISANS -->
  <div class="view hidden" id="view-art">
    <div class="db-note" id="art-note"></div>
    <div class="art-grid" id="art-grid"></div>
  </div>

  <footer id="footer"></footer>
</div>

  {"id":"a-isezaki","name":{"zh":"伊势崎淳","en":"Jun Isezaki","ja":"伊勢崎淳"},"craftId":"chu-bizen","specialty":{"zh":"备前烧","en":"Bizen ware","ja":"備前焼"},"born":1936,"death":2026,"year":2004,"bio":{"zh":"生于冈山县备前市伊部的备前烧世家，冈山大学毕业后与兄复原中世半地下式穴窑，复兴古备前烧成技法；既守火襷等古法，亦作现代陶壁。2004年认定为备前烧保持者（人间国宝），2025年文化功劳者，2026年辞世。","en":"Born into a Bizen pottery family in Inbe, Bizen; after Okayama University he and his brother rebuilt a medieval anagama, reviving old-Bizen firing. He upheld hidasuki while also creating modern ceramic walls, was named a Bizen-ware Living National Treasure in 2004, Person of Cultural Merit in 2025, and died in 2026.","ja":"岡山県備前市伊部の備前焼の家に生まれ、岡山大学卒業後、兄と中世の半地下式穴窯を復元して古備前の焼成を復興。火襷などの古法を守りつつ現代の陶壁も手がけ、2004年に備前焼の人間国宝に認定、2025年文化功労者、2026年没。"},"lineage":{"zh":"父为备前陶工伊势崎阳山，随父习陶；与兄伊势崎满共同复原古窑。","en":"Son of the Bizen potter Isezaki Yozan; trained under his father and rebuilt the old kiln with his brother Mitsuru.","ja":"父・伊勢崎陽山に師事。兄・伊勢崎満と古窯の復元に取り組む。"},"works":{"zh":"新首相官邸陶壁（2002）、角花器（2020）；作品藏于大都会、大英、V&A 等馆。","en":"Ceramic wall of the new Prime Minister's Residence (2002) and 'Angular Vase' (2020); held by the Met, British Museum and V&A.","ja":"新首相官邸の陶壁（2002）、「角花器」（2020）など。メトロポリタン美術館、大英博物館、V&Aに収蔵。"}},
  {"id":"a-kaneshige","name":{"zh":"金重陶阳","en":"Toyo Kaneshige","ja":"金重陶陽"},"craftId":"chu-bizen","specialty":{"zh":"备前烧","en":"Bizen ware","ja":"備前焼"},"born":1896,"death":1967,"year":1956,"bio":{"zh":"备前六姓名门金重家出身，十四五岁随父习陶。研究桃山古备前而再现其土味与绯襷窑变，使一度沦为杂器的备前烧重归艺术，被誉为「备前烧中兴之祖」。1956年成为备前烧第一位人间国宝。","en":"From the Kaneshige family, one of the six hereditary Bizen houses; trained under his father from about fourteen. By reviving Momoyama Bizen clay and hidasuki effects he lifted Bizen back to fine art, earning the title 'reviver of Bizen ware'. In 1956 he became the first Living National Treasure in Bizen.","ja":"備前焼「六姓」の名門・金重家に生まれ、14歳頃から父に陶技を学ぶ。桃山古備前の土と緋襷を再現し、備前焼を格調ある芸術へ復興させ「備前焼中興の祖」と称された。1956年、備前焼で初の人間国宝に認定。"},"lineage":{"zh":"父为胁窑陶工金重楳阳；1949年与藤原启、山本陶秀等结「备前窑艺会」，影响后世备前人间国宝。","en":"Trained from about 14 under his father Kaneshige Baiyo; in 1949 co-founded the Bizen Kogeikai with Fujiwara Kei and Yamamoto Toshu, shaping later Bizen Living National Treasures.","ja":"父・金重楳陽に師事。1949年、藤原啓・山本陶秀らと「備前窯芸会」を結成し、後の備前の人間国宝へ流れをつないだ。"},"works":{"zh":"备前绯襷轮花花器（1951）、备前水指（1959）等，藏于东京国立近代美术馆等。","en":"'Bizen Hidasuki Flower Vessel' (1951), 'Bizen Water Jar' (1959), held by the National Museum of Modern Art, Tokyo.","ja":"「備前緋襷輪花花器」（1951）、「備前水指」（1959）など、東京国立近代美術館等に収蔵。"}},
  {"id":"a-tokuda","name":{"zh":"三代德田八十吉","en":"Yasokichi Tokuda III","ja":"三代徳田八十吉"},"craftId":"chu-kutani","specialty":{"zh":"彩釉瓷","en":"Polychrome-glazed porcelain","ja":"彩釉磁器"},"born":1933,"death":2009,"year":1997,"bio":{"zh":"初代德田八十吉之孙，金泽美术工艺大学中退后师事初代、二代。从古九谷「青手」出发，以九谷五彩中除红外的四彩调配约七十种釉色，凭浓淡渐层确立独创的「耀彩」彩釉。1997年认定为彩釉瓷保持者（人间国宝）。","en":"Grandson of Tokuda Yasokichi I; trained under the first and second generations. Starting from Ko-Kutani aote, he built compositions from some seventy glaze colours derived from four of the five Kutani enamels, creating the original 'yosai' (glittering colour). Designated a Living National Treasure for polychrome-glazed porcelain in 1997.","ja":"初代徳田八十吉の孫。古九谷の青手を出発点に、九谷五彩のうち赤を除く四彩で約70種の釉薬を調合し、色のグラデーションのみで構成する独自の「耀彩」を確立。1997年、彩釉磁器の人間国宝に認定。"},"lineage":{"zh":"祖父初代德田八十吉（擅吉田屋窑风），父二代德田八十吉；1988年袭名三代，长女2010年袭名四代。","en":"Grandson of Tokuda Yasokichi I (Yoshidaya style) and son of the second generation; succeeded as Yasokichi III in 1988; his eldest daughter succeeded as IV in 2010.","ja":"祖父は初代徳田八十吉（吉田屋窯風）、父は二代。1988年に三代を襲名、長女が2010年に四代を襲名。"},"works":{"zh":"耀彩轮华文钵（1986，京都国立近代美术馆藏）、彩釉钵系列（东京国立近代美术馆工艺馆藏）。","en":"'Bowl with flower design' (1986, National Museum of Modern Art, Kyoto) and a series of polychrome-glaze bowls (MOMAT Crafts Gallery).","ja":"「耀彩輪華文鉢」（1986年、京都国立近代美術館蔵）、彩釉鉢の系列（東京国立近代美術館工芸館）。"}},
  {"id":"a-imaemon","name":{"zh":"十四代今泉今右卫门","en":"Imaemon Imaizumi XIV","ja":"十四代今泉今右衛門"},"craftId":"kyu-arita","specialty":{"zh":"色绘瓷","en":"Overglaze enamel porcelain","ja":"色絵磁器"},"born":1962,"death":null,"year":2014,"bio":{"zh":"十三代今右卫门次子，武藏野美术大学金工专攻毕业后师事京都陶艺家铃木治，1990年回有田承家业，2002年袭名十四代。以家传「色锅岛」为本，发展「墨弹」并独创「雪花墨弹」与铂金彩，2014年以51岁成为史上最年轻的人间国宝（陶艺）。","en":"Second son of Imaemon XIII; after metalwork studies at Musashino Art University he trained under the Kyoto ceramist Suzuki Osamu, returned to Arita in 1990 and succeeded as XIV in 2002. Building on family Iro-Nabeshima, he developed sumihajiki and his 'snowflake sumihajiki' with platinum overglaze; in 2014, aged 51, he became the youngest ceramist Living National Treasure.","ja":"十三代の次男。武蔵野美術大学（金工専攻）卒業後、京都の鈴木治に師事、1990年に有田へ戻り2002年に十四代を襲名。色鍋島を軸に「墨はじき」を深化させ「雪花墨はじき」やプラチナ彩を確立。2014年、51歳で史上最年少の陶芸の人間国宝に。"},"lineage":{"zh":"今泉家自江户时代任锅岛藩御用赤绘师，色锅岛1971年指定为重要无形文化财，由家族「色锅岛技术保存会」传承；父十三代确立吹墨、薄墨技法。","en":"The Imaizumi house served the Nabeshima domain as official overglaze enamellers; Iro-Nabeshima was designated an Important Intangible Cultural Property in 1971 and is kept by the family preservation society; his father XIII established fukizumi and usuzumi.","ja":"今泉家は江戸時代より鍋島藩の御用赤絵師。色鍋島は1971年に重要無形文化財に指定され、今右衛門家の保存会が伝承。父・十三代は「吹墨」「薄墨」を確立。"},"works":{"zh":"色绘薄墨墨弹雪文钵、色绘雪花薄墨墨弹四季花文花瓶（2011，确立雪花墨弹之作）。","en":"'Bowl with snow design, usuzumi and sumihajiki' and 'Vase with four-season flowers, snowflake usuzumi sumihajiki' (2011), the work that established the technique.","ja":"「色絵薄墨墨はじき雪文鉢」、「色絵雪花薄墨墨はじき四季花文花瓶」（2011年、技法を確立した代表作）。"}},
  {"id":"a-inoue","name":{"zh":"井上万二","en":"Manji Inoue","ja":"井上萬二"},"craftId":"kyu-arita","specialty":{"zh":"白瓷","en":"White porcelain","ja":"白磁"},"born":1929,"death":2025,"year":1995,"bio":{"zh":"生于有田窑元之家，战后入十三代酒井田柿右卫门窑，约1952年受奥川忠右卫门作品震撼而转习白磁与辘轳。在以彩绘著称的有田烧中坚持不施笔绘的纯白白磁，追求无懈可击的造型。1995年认定为白磁保持者（人间国宝），2025年辞世。","en":"Born into a kiln-owning family in Arita; after the war he entered the 13th Sakaida Kakiemon's kiln and around 1952, struck by Okugawa Chuemon's work, devoted himself to white porcelain and the wheel. In a tradition famed for overglaze painting he pursued unpainted pure white porcelain; designated a Living National Treasure for hakuji in 1995, died in 2025.","ja":"有田の窯元の家に生まれ、戦後十三代酒井田柿右衛門の窯に入り、1952年頃に奥川忠右衛門の作品に衝撃を受けて白磁と轆轤に専念。華やかな絵付けの有田焼にあって筆を加えない白磁一筋を貫き、1995年白磁の人間国宝に認定、2025年没。"},"lineage":{"zh":"1945年起于十三代酒井田柿右卫门窑修行，约1952年入奥川忠右卫门门下；1958年任佐贺县立有田窑业试验场技官，子、孙继其窑。","en":"Trained from 1945 at the 13th Kakiemon kiln, then pupil of Okugawa Chuemon from c.1952; from 1958 a technician at the Saga Prefectural Arita Ceramics Research Institute; succeeded by his son and grandson.","ja":"1945年から十三代柿右衛門窯で修行、1952年頃に奥川忠右衛門に師事。1958年佐賀県立有田窯業試験場技官。子・孫が窯を継ぐ。"},"works":{"zh":"白磁绿釉牡丹雕文花瓶（2006，东广岛市立美术馆藏）、白磁牡丹雕文面取壶等。","en":"'White porcelain vase with green glaze and carved peony' (2006, Higashihiroshima City Museum of Art) and faceted white-porcelain peony jars.","ja":"「白磁緑釉牡丹彫文花瓶」（2006年、東広島市立美術館蔵）、「白磁牡丹彫文面取壺」など。"}},
  {"id":"a-kato","name":{"zh":"加藤卓男","en":"Takuo Kato","ja":"加藤卓男"},"craftId":"chu-mino","specialty":{"zh":"三彩","en":"Sancai (three-colour)","ja":"三彩"},"born":1917,"death":2005,"year":1995,"bio":{"zh":"美浓名窑幸兵卫窑第六代当主，1961年留学芬兰期间访伊朗而倾心波斯陶器，十余次赴中东，成功解明并再现17世纪已失传的虹彩、青釉、三彩等低温釉。1980年受宫内厅委嘱复原正仓院三彩，历时九年；1995年认定为三彩保持者（人间国宝）。","en":"Sixth-generation head of the Mino Kobei kiln; after studying in Finland in 1961 and visiting Iran he devoted himself to Persian ceramics, travelling to the Middle East a dozen times to decipher and recreate lost low-fired glazes (lustre, blue, sancai). In 1980 the Imperial Household Agency commissioned him to reconstruct Shosoin sancai, taking nine years; designated a Living National Treasure for sancai in 1995.","ja":"美濃の名窯・幸兵衛窯六代目。1961年フィンランド留学中にイランを訪れてペルシア陶器に傾倒、中東へ十数回通って17世紀に途絶えたラスター彩・青釉・三彩などの低火度釉を再現。1980年宮内庁から正倉院三彩の復元を委嘱され9年を費やし、1995年三彩の人間国宝に認定。"},"lineage":{"zh":"幸兵卫窑第六代，父为五代加藤幸兵卫（青瓷等）；1961年留学芬兰，1973年赴伊朗参与波斯古陶发掘，子七代、孙亮太郎继其业。","en":"Sixth-generation Kobei; son of Kobei V (celadon); studied in Finland (1961) and at Pahlavi University, Iran (1973); succeeded by his son (VII) and grandson Ryotaro.","ja":"幸兵衛窯六代。父は五代加藤幸兵衛（青磁など）。1961年フィンランド、1973年イラン・パーラヴィ大学に留学しペルシア古陶発掘に参加。子・七代、孫・亮太郎が継ぐ。"},"works":{"zh":"虹彩四方大盘「遥」、三彩贴花文仙盏瓶「瑞鸟」、正仓院三彩复原（1980–89）、1992年伊势神宫御神宝陶猿头形砚。","en":"'Lustre square platter Haruka', 'Sancai ewer Zuicho', the reconstructed Shosoin sancai (1980–89), and the monkey-head inkstone for the 1992 Ise Shrine ritual treasures.","ja":"「ラスター彩四方大皿『遥か』」「三彩貼花文仙盞瓶『瑞鳥』」、正倉院三彩復元（1980–89）、1992年伊勢神宮の御神宝「陶猿頭形御硯」。"}},
  {"id":"a-arakawa","name":{"zh":"荒川丰藏","en":"Toyozo Arakawa","ja":"荒川豊蔵"},"craftId":"chu-mino","specialty":{"zh":"志野·濑户黑","en":"Shino & Seto-guro","ja":"志野・瀬戸黒"},"born":1894,"death":1985,"year":1955,"bio":{"zh":"多治见制陶世家出身，1922年入京都宫永东山窑，1927年应北大路鲁山人之邀赴镰仓星冈窑。1930年因名古屋所见志野笋绘茶碗高台红土置疑，掘出同纹古陶片，证实志野出自美浓而非濑户；1933年于古窑旁筑窑毕生再现桃山陶。1955年首批认定为志野、濑户黑保持者（人间国宝），1971年获文化勋章。","en":"From a Tajimi potting family; in 1922 he joined Miyanaga Tozan's Kyoto kiln and in 1927 went to Kamakura at Kitaoji Rosanjin's invitation. In 1930, noticing red clay on a Shino tea bowl's foot in Nagoya, he excavated a shard with the same design, proving Shino originated in Mino not Seto; in 1933 he built his kiln and devoted his life to Momoyama ceramics. In 1955 he was among the first designated Living National Treasures for Shino and Seto-guro, receiving the Order of Culture in 1971.","ja":"多治見の製陶の家に生まれ、1922年に京都・宮永東山の東山窯に入り、1927年北大路魯山人に招かれ鎌倉の星岡窯へ。1930年、名古屋で見た志野筍絵茶碗の高台の赤土に疑問を持ち同文様の陶片を発掘、志野は瀬戸ではなく美濃と実証。1933年に築窯し桃山陶の再現に生涯を捧げ、1955年志野・瀬戸黒の人間国宝に（第一次指定）、1971年文化勲章。"},"lineage":{"zh":"母方为多治见高田制陶世家；1922年入宫永东山窑任工场长，1925年识北大路鲁山人并受其古陶收藏影响；长子武夫、孙广一继其业，1984年开丰藏资料馆。","en":"On his mother's side from a Tajimi potting line; joined Miyanaga Tozan's kiln as works manager in 1922 and was shaped by Kitaoji Rosanjin's collection from 1925; continued by his son Takeo and grandson Hiroichi; the Arakawa Toyozo Museum opened in 1984.","ja":"母方は多治見高田の製陶家系。1922年に宮永東山の東山窯の工場長となり、1925年北大路魯山人と出会い古陶磁に影響される。長子・武夫、孫・広一が継承。1984年に豊蔵資料館開館。"},"works":{"zh":"志野笋绘茶碗铭「随缘」（1961，荒川丰藏资料馆藏）、濑户黑茶碗、黄濑户花入（1964寄赠茨城大学）；藏于东京国立博物馆等。","en":"'Shino tea bowl, bamboo-shoot design, named Zuien' (1961, Arakawa Toyozo Museum), Seto-guro bowls, 'Ki-Seto flower vase' (1964); held by the Tokyo National Museum.","ja":"「志野筍絵茶碗 銘『随縁』」（1961年、豊蔵資料館蔵）、瀬戸黒茶碗、「黄瀬戸花入」（1964年寄贈）。東京国立博物館等にも収蔵。"}},
  {"id":"a-suzuki","name":{"zh":"铃木藏","en":"Osamu Suzuki","ja":"鈴木藏"},"craftId":"chu-mino","specialty":{"zh":"志野","en":"Shino","ja":"志野"},"born":1934,"death":null,"year":1994,"bio":{"zh":"岐阜县土岐市驮知町出身，釉药专家铃木通雄之子。研究桃山志野古窑遗址，1968年独立并参考半地下式穴窑原理自建煤气窑，以现代技术复兴并革新志野。1994年认定为志野保持者（人间国宝），2024年获文化功劳者。","en":"Son of the glaze researcher Suzuki Michio, from Dachi, Toki, Gifu. After studying Momoyama Shino kiln sites he became independent in 1968, building a gas kiln modelled on the anagama, and revived and renewed Shino with modern technique. Designated a Living National Treasure for Shino in 1994, Person of Cultural Merit in 2024.","ja":"岐阜県土岐市駄知町の出身、釉薬研究者・鈴木通雄の子。桃山の志野古窯跡を研究し、1968年に独立、穴窯を参考にしたガス窯を築いて現代的技術で志野を確立。1994年志野の人間国宝に認定、2024年文化功労者。"},"lineage":{"zh":"自幼随父学陶土釉药；曾受五代加藤幸兵卫指导，并师事荒川丰藏、加藤土师萌；任日本工艺会志野传承研修讲师。","en":"Learned clay and glaze from his father; instructed by Kato Kobei V and studied under Arakawa Toyozo and Kato Hajime; lecturer for the Japan Kogei Association's Shino training course.","ja":"父に陶土・釉薬を学び、五代加藤幸兵衛に作陶を学び荒川豊蔵・加藤土師萌に師事。日本工芸会「志野」伝承者養成講師。"},"works":{"zh":"志野茶盌（1991，东京国立博物馆藏）、食器揃「流旅转生」（1985）等。","en":"'Shino Tea Bowl' (1991, Tokyo National Museum) and the tableware set 'Ryuryo Tensho' (1985).","ja":"「志野茶盌」（1991年、東京国立博物館蔵）、食器揃「流旅転生」（1985）など。"}},
  {"id":"a-kinjo","name":{"zh":"金城次郎","en":"Jiro Kinjo","ja":"金城次郎"},"craftId":"oki-tsuboya","specialty":{"zh":"琉球陶器","en":"Ryukyu pottery","ja":"琉球陶器"},"born":1912,"death":2004,"year":1985,"bio":{"zh":"那霸市与仪出身的壶屋烧陶工，1925年师事新垣荣德，同年识民艺运动的滨田庄司。战后于壶屋筑窑，1972年因登窑烟害迁往读谷村。以质朴日用杂器与幽默的「鱼纹」「虾纹」闻名，1985年成为冲绳县首位人间国宝（琉球陶器）。","en":"A Tsuboya-ware potter from Yogi, Naha; apprenticed to Arakaki Eitoku from 1925 and that year met the mingei leader Hamada Shoji. He opened his workshop in Tsuboya after the war and moved to Yomitan in 1972; known for humble everyday wares and humorous fish and shrimp motifs, in 1985 he became the first Living National Treasure from Okinawa (Ryukyu pottery).","ja":"那覇市与儀生まれの壺屋焼の陶工。1925年に新垣栄徳に師事し、同年民藝の濱田庄司と出会う。戦後、壺屋に工房を開き1972年に読谷村へ移住。素朴な日用雑器と「魚紋」「海老紋」で知られ、1985年に沖縄県初の人間国宝（琉球陶器）に。"},"lineage":{"zh":"1924年入新垣荣德制陶所，1925年正式师事；受柳宗悦民艺思想与滨田庄司、河井宽次郎指导。子女皆为陶艺家，合称「金城一门」。","en":"Entered Arakaki Eitoku's pottery in 1924 and trained under him; influenced by Yanagi Sōetsu's mingei and guided by Hamada Shoji and Kawai Kanjiro. All his children became potters, the 'Kinjo school'.","ja":"1924年に新垣栄徳の製陶所に入門、1925年に師事。柳宗悦の民藝思想と濱田庄司・河井寛次郎の指導を受ける。子らも陶芸家、「金城一門」。"},"works":{"zh":"鱼纹大皿（1967）、抱瓶黑釉指描（1957国画赏）；2023年南城市开「金城次郎馆」藏约300件。","en":"'Large dish with fish design' (1967), 'Dachibin flask, finger-drawn black glaze' (1957, Kokuga Prize); the Kinjo Jiro Museum opened in Nanjo, Okinawa, in 2023 with some 300 works.","ja":"「魚紋大皿」（1967年）、「抱瓶黒釉指描」（1957年国画賞）。2023年南城市に「金城次郎館」開館（約300点）。"}},
  {"id":"a-moriguchi","name":{"zh":"森口邦彦","en":"Kunihiko Moriguchi","ja":"森口邦彦"},"craftId":"kan-yuzen","specialty":{"zh":"友禅","en":"Yuzen","ja":"友禅"},"born":1941,"death":null,"year":2007,"bio":{"zh":"友禅人间国宝森口华弘之子，京都市立美术大学日本画科毕业后赴法，1966年巴黎国立高等装饰美术学院毕业。受画家巴尔蒂斯劝归国继承家业，将欧普/波普几何抽象与传统友禅「蒔糊」结合。1995年京都府指定无形文化财，2007年认定为友禅保持者（人间国宝），2020年文化功劳者。","en":"Son of the yuzen Living National Treasure Moriguchi Kako; after nihonga studies in Kyoto he graduated from the ENSAD in Paris in 1966. Urged by the painter Balthus to return, he entered his father's workshop and fused geometric abstraction with traditional yuzen. Kyoto Prefectural Intangible Cultural Property in 1995, Living National Treasure for yuzen in 2007, Person of Cultural Merit in 2020.","ja":"友禅の人間国宝・森口華弘の子。京都市立美術大学日本画科卒業後、パリ国立高等装飾美術学校を1966年に卒業。画家バルテュスの勧めで帰国し父の工房へ。幾何学的抽象と伝統の友禅・蒔糊を融合。1995年京都府指定無形文化財、2007年友禅の人間国宝、2020年文化功労者。"},"lineage":{"zh":"父森口华弘（1967年友禅人间国宝、蒔糊创始者）；京都市立美术大学、巴黎装饰美院出身，1967年入父工房，父子两代友禅人间国宝。","en":"Son of Moriguchi Kako (1967 yuzen Living National Treasure, originator of makinori); trained in Kyoto and Paris, apprenticed in his father's workshop from 1967 — a rare father-and-son pair of yuzen Living National Treasures.","ja":"父は1967年友禅の人間国宝・蒔糊創始の森口華弘。京都市立美術大学・パリ装飾美院を経て1967年から父の工房で修業。父子二代の友禅人間国宝。"},"works":{"zh":"霊明（1969）、千花（1969）、溪流（1973）；V&A藏「Green Waves」、大都会藏「Water Design」；2014年三越「实り」提袋获Good Design赏。","en":"'Reimei' (1969), 'Senka' (1969), 'Keiryu' (1973); 'Green Waves' (V&A) and 'Water Design' (Met); in 2014 his Mitsukoshi 'Minori' bag won a Good Design Award.","ja":"『霊明』（1969）、『千花』（1969）、『渓流』（1973）。V&A「Green Waves」、メトロポリタン「Water Design」を収蔵。2014年三越「実り」手提袋がグッドデザイン賞。"}},
  {"id":"a-tajima","name":{"zh":"田岛比吕子","en":"Hiroshi Tajima","ja":"田島比呂子"},"craftId":"tokyo-tegaki-yuzen","specialty":{"zh":"友禅","en":"Yuzen","ja":"友禅"},"born":1922,"death":2014,"year":1999,"bio":{"zh":"本名田岛博，生于东京。1936年入小石川友禅模样师高村樵耕门下习日本画基础，战后复员后疗养期间受正冈子规影响始咏短歌。1954年独立重启友禅，1999年（77岁）成为友禅第八位保持者（人间国宝），同年藤泽市名誉市民，2014年辞世。","en":"Real name Tajima Hiroshi, born in Tokyo; in 1936 he apprenticed to the yuzen pattern designer Takamura Shoko, learning nihonga fundamentals. After the war he resumed yuzen and became independent in 1954; in 1999, aged 77, he became the eighth Living National Treasure for yuzen and an honorary citizen of Fujisawa, dying in 2014.","ja":"本名・博。東京生まれ。1936年、小石川の友禅模様師・高村樵耕に内弟子として入門し日本画の基礎を学ぶ。戦後、1954年に独立して友禅を再開。1999年、77歳で友禅8人目の人間国宝となり藤沢市名誉市民、2014年没。"},"lineage":{"zh":"以「模样师」身份启蒙（自行设计而非染师），奠定独立创作路线；经高村柳治劝说出品传统工艺展，与中村胜马、山田贡等友禅人间国宝交流。","en":"Trained as a moyoshi (pattern designer) rather than a dyer, which shaped his self-designed practice; urged by Takamura Ryuji to exhibit, he associated with yuzen Living National Treasures Nakamura Katsuma and Yamada Mitsugi.","ja":"染師ではなく意匠を担う「模様師」として入門、作家活動の基盤に。高村柳治の勧めで伝統工芸展出品、中村勝馬・山田貢と交流。"},"works":{"zh":"摇影（一）（1959初入选）、青东风（1966总会裁赏）、入江（1998保持者赏）；以「叩糊」「堰出糊」著称，藏于Silk博物馆等。","en":"'Yoei (I)' (1959, first acceptance), 'Aogochi' (1966 President's Prize), 'Irie' (1998 Holders' Prize); noted for tataki-nori and sekidashi-nori; held by the Silk Museum.","ja":"「揺影（一）」（1959年初入選）、「青東風」（1966年総裁賞）、「入江」（1998年保持者賞）。「叩き糊」「堰出し糊」を特徴とし、シルク博物館等に収蔵。"}},
  {"id":"a-tamanaha","name":{"zh":"玉那霸有公","en":"Yuko Tamanaha","ja":"玉那覇有公"},"craftId":"oki-bingata","specialty":{"zh":"红型","en":"Bingata","ja":"紅型"},"born":1936,"death":null,"year":1996,"bio":{"zh":"冲绳县石垣市出身的红型师，1961年师事县指定无形文化财「びん型」保持者城间荣喜，1963年于首里独立设坊。擅长「两面染」并独创「二枚异型」技法，以精密型雕与高明度中间色表现光与动感。1996年成为红型首位人间国宝，1998年获紫绶褒章。","en":"A bingata stencil-dyer from Ishigaki, Okinawa; in 1961 he trained under Shiroma Eiki, a prefecturally designated bingata holder, and set up independently in Shuri in 1963. Excelling at double-sided dyeing, he devised the 'nimai-igata' two-stencil technique, using precise cutting and high-key colours to evoke light and movement. In 1996 he became the first Living National Treasure in bingata; received the Medal with Purple Ribbon in 1998.","ja":"石垣市出身の紅型師。1961年、県指定無形文化財「びん型」保持者・城間栄喜に師事、1963年に首里で独立。両面染めに秀で「二枚異型」の技法を考案、緻密な型彫りと明度の高い中間色で光と動きを表す。1996年、紅型で最初の人間国宝に、1998年紫綬褒章。"},"lineage":{"zh":"1961年师事红型宗家城间荣喜；1963年于其工房附近独立；子玉那霸有胜（1968年生）继其业。","en":"Studied from 1961 under Shiroma Eiki of the Shiroma bingata house; set up near the Shiroma workshop in 1963; his son Yusho (b.1968) continues the work.","ja":"1961年、紅型宗家・城間栄喜に師事。1963年に城間工房の近くで独立。息子の有勝（1968年生）が継ぐ。"},"works":{"zh":"红型二枚异型两面染着物（1999，东京国立博物馆藏）、芭蕉布地两面红型着物（1996，东京国立博物馆藏）；1991年传统工艺展文部大臣赏。","en":"'Bingata double-sided kimono with two differing stencils' (1999) and 'bashofu kimono, double-sided bingata' (1996), both in the Tokyo National Museum; Minister of Education Prize at the 1991 Traditional Kogei Exhibition.","ja":"「紅型二枚異型両面染着物」（1999年）、「芭蕉布地両面紅型着物」（1996年）ともに東京国立博物館蔵。1991年伝統工芸展文部大臣賞。"}},
  {"id":"a-fukuda","name":{"zh":"福田喜重","en":"Kiju Fukuda","ja":"福田喜重"},"craftId":"kan-yuzen","specialty":{"zh":"刺绣","en":"Embroidery","ja":"刺繡"},"born":1932,"death":2022,"year":1997,"bio":{"zh":"京都市出身的刺绣家，1948年起师事其父、刺绣家福田喜三郎，习得正统传统技法。以和服为主，用一越缩缅、绫子地，结合自家的染与金银箔，追求色线的微妙渐层与流动曲线。1992年京都府指定无形文化财（刺绣），1997年成为刺绣领域唯一的人间国宝，2022年辞世。","en":"A Kyoto embroidery artist who from 1948 trained under his father Fukuda Kizaburo, acquiring orthodox technique. Working mainly on kimono in hitokoshi-chirimen and rinzu silks, he combined embroidery with his own dyeing and gold/silver foil to produce subtle gradations and flowing curves. Kyoto Prefectural Intangible Cultural Property (embroidery) in 1992, the only Living National Treasure ever designated in embroidery, in 1997; died in 2022.","ja":"京都市生まれの刺繡家。1948年から父・福田喜三郎に師事し本格的な伝統技法を習得。主に和服を作り、一越縮緬や綸子地を用い、自らの染めや箔と刺繡を組み合わせて奥行きのある表現を追求。1992年京都府指定無形文化財「刺繡」、1997年刺繡で唯一の人間国宝に、2022年没。"},"lineage":{"zh":"家族传承：父福田喜三郎为刺绣家，1956年继承1927年创业的福田商店，1970年改称福田工艺染绣研究所；喜重为第二代。","en":"Direct family transmission: trained under his father Kizaburo; took over the family Fukuda Shoton (founded 1927) in 1956, renamed the Fukuda Kogei Senshu Kenkyujo in 1970 — Kiju as second-generation head.","ja":"家業による継承。父・喜三郎に師事し、1927年創業の福田商店を1956年に継ぎ1970年に福田工芸染繡研究所へ改名。喜重は二代目。"},"works":{"zh":"刺绣访问着「百合之集」（2019）、罗地竹屋町（1981，与北村武资共作，京都国立近代美术馆藏）。","en":"Embroidered homongi 'Yuri no Tsudoi' (2019) and 'Takeyamachi embroidery on ra fabric' (1981, with Kitamura Takeshi; National Museum of Modern Art, Kyoto).","ja":"刺繡訪問着「百合の集い」（2019年）、「羅地竹屋町」（1981年、北村武資との共作、京都国立近代美術館蔵）。"}},
  {"id":"a-murose","name":{"zh":"室濑和美","en":"Kazumi Murose","ja":"室瀬和美"},"craftId":"chu-wajima","specialty":{"zh":"蒔绘","en":"Maki-e","ja":"蒔絵"},"born":1950,"death":null,"year":2008,"bio":{"zh":"东京出身的漆艺家，父亦为漆艺家室濑春二。东京艺术大学师事蒔绘人间国宝松田权六与其高弟田口善国，1976年修毕研究所。长年从事漆器文化财的保存修复，并擅「研出蒔绘」，以不同颗粒金粉层叠与螺钿营造纵深。2008年认定为蒔绘保持者（人间国宝），同年紫绶褒章。","en":"A Tokyo lacquer artist, son of the urushi artist Murose Shunji; at Tokyo University of the Arts he studied under the maki-e Living National Treasure Matsuda Gonroku and his principal pupil Taguchi Yoshikuni, completing graduate study in 1976. Long engaged in lacquer conservation, he works in togidashi maki-e, layering gold powders of differing grain with raden for depth. Designated a Living National Treasure for maki-e in 2008, with the Medal with Purple Ribbon the same year.","ja":"東京生まれの漆芸家。父は漆芸家・室瀬春二。東京藝術大学で蒔絵の人間国宝・松田権六とその高弟・田口善国に師事、1976年大学院修了。漆工文化財の保存修復に長く携わり、研出蒔絵を得意とし金粉の層と螺鈿で奥行きを生む。2008年蒔絵の人間国宝に認定、同年紫綬褒章。"},"lineage":{"zh":"家学（父室濑春二）与学院（东艺大松田权六、田口善国）双重传承；1991年设目白漆艺文化财研究所，兼事修复与育后。","en":"A double lineage of family (father Shunji) and academy (Matsuda Gonroku, Taguchi Yoshikuni at Tokyo Geidai); founded the Mejiro Institute of Urushi Research and Restoration in 1991, combining conservation with training.","ja":"家系（父・春二）と学統（東藝大・松田権六・田口善国）の二重の継承。1991年に目白漆芸文化財研究所を開設し修復と後進育成にあたる。"},"works":{"zh":"蒔绘螺钿八棱箱「彩光」（2000，文化厅藏）、蒔绘螺钿小箪笥「青松」（2006）、蒔绘丸筥「百华」（2012，大英博物馆藏）。","en":"'Octagonal box Saiko' (2000, Agency for Cultural Affairs), 'Small chest Seisho' (2006), 'Round box Hyakka' (2012, British Museum).","ja":"「蒔絵螺鈿八稜箱『彩光』」（2000年、文化庁蔵）、「蒔絵螺鈿小箪笥『青松』」（2006年）、「蒔絵丸筥『百華』」（2012年、大英博物館蔵）。"}},
  {"id":"a-kitamura","name":{"zh":"北村昭斋","en":"Shosai Kitamura","ja":"北村昭斎"},"craftId":"chu-wajima","specialty":{"zh":"螺钿","en":"Raden","ja":"螺鈿"},"born":1938,"death":2023,"year":1999,"bio":{"zh":"奈良漆艺世家出身，东京艺术大学工艺科毕业后曾任职夏普工业设计，后归父北村大通门下从事漆艺与文物修复。以奈良漆器「厚贝螺钿」为代表，结合玳瑁、玛瑙与蒔绘，作风源于正仓院宝物研究。1999年认定为螺钿保持者（人间国宝），2023年辞世。","en":"From a Nara lacquer family; after the Crafts Department of Tokyo University of the Arts he briefly did industrial design at Sharp, then joined his father Kitamura Daitsu in lacquer and conservation. Leading the Nara tradition of thick-shell raden, he combined tortoiseshell, agate and maki-e, rooted in Shosoin studies. Designated a Living National Treasure for raden in 1999, died in 2023.","ja":"奈良の漆芸の家に生まれ。東京藝術大学工芸科卒業後、シャープの工業デザインを経て父・北村大通のもとで漆芸と文化財修理に従事。奈良漆器の厚貝螺鈿を代表とし、玳瑁・瑪瑙・蒔絵を組み合わせ正倉院の研究に基づく。1999年螺鈿の人間国宝に認定、2023年没。"},"lineage":{"zh":"祖父久斋、父北村大通（漆艺家兼文物修复专家，主持正仓院宝物等修复）；东艺大后师承其父，长子繁、长女宁子继其业。","en":"Grandson of Kyusai and son of Kitamura Daitsu, a lacquer artist and conservator who led Shosoin restorations; trained under his father after Tokyo Geidai; continued by his son Shigeru and daughter Yasuko.","ja":"祖父・久斎、父・北村大通（漆芸家で正倉院宝物などの修理を主導）の家系。東藝大後、父に師事。子の繁、娘の寧子が継ぐ。"},"works":{"zh":"华文玳瑁螺钿饰箱（1997，京都国立近代美术馆藏）、兔纹螺钿箱（1982）、螺钿小箱「松鼠」（1988，东京国立近代美术馆工艺馆藏）。","en":"'Casket with flower design, tortoiseshell and raden' (1997, National Museum of Modern Art, Kyoto), 'Box, rabbit design' (1982) and 'Small box Squirrel' (1988, MOMAT Crafts Gallery).","ja":"「華文玳瑁螺鈿飾箱」（1997年、京都国立近代美術館蔵）、「うさぎ文螺鈿箱」（1982年）、「螺鈿小箱『りす』」（1988年、東京国立近代美術館工芸館）。"}},
  {"id":"a-suzuki-seikyu","name":{"zh":"铃木盛久（十三代）","en":"Suzuki Morihisa XIII","ja":"鈴木盛久（十三代）"},"craftId":"toh-nambu","specialty":{"zh":"南部铁器","en":"Nambu ironware","ja":"南部鉄器"},"born":1896,"death":1976,"year":1974,"bio":{"zh":"岩手县盛冈市南部铁器铸造世家的袭名（1625年创业）。第十三代盛久·铃木繁吉（1896年生，1924年袭名），其传统铸技于1974年获国家指定为「选择无形文化财」（记录作成等措置），以技法保存而非个人人间国宝之形获认定。工房现已传至第十六代。","en":"A hereditary studio name of a Nambu ironware casting family in Morioka, Iwate (founded 1625). The 13th, Suzuki Hankichi (b.1896, took the name in 1924), saw his traditional technique designated in 1974 as a 'Selected Intangible Cultural Property' (documentation measure) — a technique-preservation status rather than an individual Living National Treasure. The workshop is now in its 16th generation.","ja":"岩手県盛岡市の南部鉄器鋳物師の名跡（1625年創業）。十三代・鈴木繁吉（1896年生、1924年襲名）の技法が1974年に「選択無形文化財（記録作成等の措置）」として国の指定を受けた——個人の人間国宝ではなく技法保存の形。現在は十六代。"},"lineage":{"zh":"始祖1625年应南部藩之召为御用铸物师；第十二代起以「盛久」为雅号。第十四代铃木贯尔为东艺大工艺科教授；长女熊谷志衣子1993年袭名十五代，为日本首位女性釜师。","en":"Founded when Suzuki Ietsuna was summoned as official caster by the Nambu domain in 1625; the art-name 'Morihisa' adopted from the 12th generation. The 14th, Kanji, was a Tokyo Geidai professor; his eldest daughter Shieko became the 15th in 1993 — Japan's first female kamashi.","ja":"始祖は1625年、南部藩の御用鋳物師として召し抱えられ、十二代より雅号「盛久」。十四代・貫爾は東藝大教授。長女・熊谷志衣子が1993年に十五代を襲名、日本初の女性釜師。"},"works":{"zh":"霰纹南部形铁瓶（十一代喜八作，1985年传统工艺邮票图样）、十三代繁吉的老铁壶、十五代熊谷志衣子「栉目丸形铁瓶」（1991总理大臣赏）。","en":"'Arare-mon Nambu tetsubin' by the 11th Kihachi (1985 crafts commemorative stamp), antique kettles by the 13th, and 'Kushime maru-gata tetsubin' by the 15th Shieko (1991 Prime Minister's Prize).","ja":"「霰紋南部形鉄瓶」（十一代喜八作、1985年伝統工芸切手）、十三代の古作鉄瓶、十五代（熊谷志衣子）「櫛目丸形鉄瓶」（1991年内閣総理大臣賞）。"}},
  {"id":"a-nakagawa","name":{"zh":"中川卫","en":"Mamoru Nakagawa","ja":"中川衛"},"craftId":"kan-tokyosilver","specialty":{"zh":"雕金（加贺象嵌）","en":"Chokin (Kaga inlay)","ja":"彫金（加賀象嵌）"},"born":1947,"death":null,"year":2004,"bio":{"zh":"石川县金泽市人，金泽美术工艺大学工业设计并毕业后入松下电工。返乡后于石川县工业试验场任职，因在县立美术馆见加贺象嵌马镫而入彫金家高桥介州门下。1979年首入传统工艺展，2004年以彫金（加贺象嵌）成为战后出生者中首位人间国宝。","en":"Born in Kanazawa, Ishikawa; after industrial-design studies he joined Matsushita Electric, then worked at the Ishikawa Industrial Research Institute while apprenticing to the chokin master Takahashi Kaishu after seeing Kaga-zogan stirrups at the prefectural museum. First exhibited in 1979; in 2004 designated a Living National Treasure for chokin (Kaga inlay) — the first postwar-born holder in the field.","ja":"石川県金沢市生まれ。金沢美術工芸大学工業デザイン科卒業後、松下電工に入社。帰郷後、石川県工業試験場に勤務しながら県立美術館で見た加賀象嵌の鐙に魅せられ彫金家・高橋介州に入門。1979年伝統工芸展初入選、2004年彫金（加賀象嵌）で戦後生まれ初の人間国宝に。"},"lineage":{"zh":"师事金泽彫金家高桥介州，继承加贺藩以来的加贺象嵌平象嵌技法；钻研高难度的「重叠象嵌」与「色金」，长年于金泽美大、造币局育后。","en":"Studied under Kanazawa chokin master Takahashi Kaishu, inheriting Kaga-zogan flat inlay; mastered the demanding kasane-zogan and irogane, teaching at Kanazawa College of Art and the Mint.","ja":"金沢の彫金家・高橋介州に師事し加賀象嵌の平象嵌を継承。難度の高い「重ね象嵌」「色金」を極め、金沢美大や造幣局で後進を育成。"},"works":{"zh":"象嵌胧银花器「岑寂树林」、象嵌胧银花器「NY.7:00」（2022，大都会艺术博物馆藏）、「北杜之朝」（2016，松下藏）。","en":"'Vase with Metal Inlay, Silent Forest', 'Vase, NY. 7:00 o'clock' (2022, Met), 'Morning in the Nordic Forest' (2016, Panasonic).","ja":"「象嵌朧銀花器『岑寂樹林』」、「象嵌朧銀花器『NY.7:00』」（2022年、メトロポリタン美術館蔵）、「『北杜の朝』」（2016年、パナソニック蔵）。"}},
  {"id":"a-okuyama","name":{"zh":"奥山峰石","en":"Hoseki Okuyama","ja":"奥山峰石"},"craftId":"kan-tokyosilver","specialty":{"zh":"锻金","en":"Tankin (hammered metal)","ja":"鍛金"},"born":1937,"death":null,"year":1995,"bio":{"zh":"山形县新庄市人，15岁赴东京入银器匠笠原宗峰门下学锻金，27岁独立，1977年再师田中光辉深研。擅切嵌、打入镶嵌等高难技法，1990年代起将象嵌与自然题材结合，形成现代而多彩的风格。1995年认定为锻金保持者（人间国宝），2018年东京都名誉都民。","en":"From Shinjo, Yamagata; at fifteen he apprenticed in Tokyo to the silversmith Kasahara Soho, set up at twenty-seven and in 1977 studied tankin further under Tanaka Koki. Excelling in kiribame and uchikomi inlay, from the 1990s he applied damascening to nature motifs, creating a modern colourful style. Designated a Living National Treasure for tankin in 1995; Honorary Citizen of Tokyo in 2018.","ja":"山形県新庄市生まれ。15歳で上京し銀器職人・笠原宗峰に鍛金の弟子入り、27歳で独立、1977年田中光輝に師事。切嵌・打込象嵌を得意とし、1990年代以降は自然のモチーフと象嵌を組み合わせた現代的な作風を確立。1995年鍛金の人間国宝に認定、2018年東京都名誉都民。"},"lineage":{"zh":"1952年入笠原宗峰门下，学徒生涯严苦；1977年师事田中光辉，1979年日本工艺会正会员。非世家出身，以「一代一职」自立，任传统工艺展审查员并育后。","en":"Entered Kasahara Soho's workshop in 1952 under an austere apprenticeship; studied further under Tanaka Koki from 1977 and became a full member of the Japan Kogei Association in 1979. Not from a craft dynasty, he rose on 'one life, one calling', later serving as a judge and teacher.","ja":"1952年、笠原宗峰に弟子入り。1977年田中光輝に師事、1979年日本工芸会正会員。「一代一職」の信条で技を築き、のち審査員・講師として後進を指導。"},"works":{"zh":"切嵌象嵌牡丹文钵（2013）、奉纳伊势神宫的大作（打入镶嵌约12,000枚樱瓣）、镶嵌金属花瓶「郁金香2」（2006）。","en":"'Bowl with Peony, Cut-and-Fit Inlay' (2013), a large Ise Shrine offering with over 12,000 hammered cherry petals, and 'Damascened Vase, Tulips 2' (2006).","ja":"「切嵌象嵌牡丹文鉢」（2013年）、伊勢神宮に奉納された約12,000枚の桜を嵌め込んだ大作、「象嵌花器 チューリップ2」（2006年）。"}},
  {"id":"a-murayama","name":{"zh":"村山明","en":"Akira Murayama","ja":"村山明"},"craftId":"kan-edosashimono","specialty":{"zh":"木竹工艺","en":"Woodwork","ja":"木工芸"},"born":1944,"death":null,"year":2003,"bio":{"zh":"兵库县尼崎市人，长年在京都活动。京都市立美术大学雕刻科毕业后师事木工艺首位人间国宝黑田辰秋，学刳物、指物。1970年首入传统工艺展获朝日新闻社赏，2003年认定为木工艺保持者（人间国宝），以拭漆显木纹为核心手法。","en":"Born in Amagasaki, Hyogo, long active in Kyoto; after the sculpture department of Kyoto City University of Arts he apprenticed to Kuroda Tatsuaki, the first Living National Treasure in woodwork, learning kurimono and sashimono. First exhibited in 1970 (Asahi Shimbun Prize); designated a Living National Treasure for woodwork in 2003, using wiped urushi to reveal the grain.","ja":"兵庫県尼崎市生まれ、京都を拠点に活動。京都市立美術大学彫刻科卒業後、木工芸で初の人間国宝・黒田辰秋に師事し刳物・指物を学ぶ。1970年伝統工芸展初入選（朝日新聞社賞）、2003年木工芸の人間国宝に認定。拭漆で木目を活かす。"},"lineage":{"zh":"师事黑田辰秋（1970年木工艺首位人间国宝，参与民艺运动）；承其「重新认识木材本身」之志，以手作榫卯（不用胶）为法，现任日本工艺会顾问。","en":"Trained under Kuroda Tatsuaki (first woodwork Living National Treasure, mingei movement); inherited his aim of rediscovering wood itself, working in hand joinery without adhesive; now adviser to the Japan Kogei Association.","ja":"黒田辰秋（木工芸で初の人間国宝、民藝運動参加）に師事。「木そのものを再認識させる」志を継ぎ、接着剤を用いない指物・刳物。日本工芸会顧問。"},"works":{"zh":"拭漆栎舟形盛器（2017）、拭漆栎大棚（京都国立近代美术馆藏）、拭漆栎厨子与盘（V&A藏）；曾奉纳伊势神宫舟形盛器。","en":"'Boat-shaped zelkova tray with wiped urushi' (2017), 'Zelkova shelf' (National Museum of Modern Art, Kyoto), 'Zelkova shrine and plate' (V&A); a boat tray was dedicated to Ise Jingu.","ja":"「欅緋拭漆舟形盛器」（2017年）、「拭漆欅大棚」（京都国立近代美術館蔵）、「拭漆欅厨子」「拭漆欅盤」（V&A蔵）。伊勢神宮へ舟形盛器を奉納。"}},
  {"id":"a-iwano","name":{"zh":"九代岩野市兵卫","en":"Ichibee Iwano IX","ja":"九代岩野市兵衛"},"craftId":"chu-echizenwashi","specialty":{"zh":"越前奉书","en":"Echizen hosho washi","ja":"越前奉書"},"born":1933,"death":null,"year":2000,"bio":{"zh":"福井县今立（今越前市）人，「岩野市兵卫」为越前和纸世袭名号，1978年袭名第九代。2000年认定为越前奉书保持者（人间国宝）。坚持仅用楮、几乎无化学药剂的传统手漉，所抄「越前生漉奉书」坚韧耐久，可承受三百次以上木版套印而伸缩极小。","en":"From Imadate (now Echizen), Fukui; 'Iwano Ichibee' is a hereditary name in Echizen washi, and he succeeded as the ninth generation in 1978. Designated a Living National Treasure for Echizen hosho in 2000. Using only kozo bark with virtually no chemicals, his hand-scooped 'kizuki hosho' is exceptionally durable, withstanding 300 woodblock impressions with minimal distortion.","ja":"福井県今立（現・越前市）の越前和紙の名跡を1978年に九代目として襲名。2000年、越前奉書の人間国宝に認定。楮のみを原料とし化学薬品をほどんど使わない手漉きで「越前生漉奉書」を漉き続け、300回の摺りにも耐える強靭さで知られる。"},"lineage":{"zh":"「岩野市兵卫」自初代起专司生漉奉书；九代为八代之子，自幼随父习艺，1978年袭名，六十余年专注一纸。","en":"'Iwano Ichibee' has been devoted to kizuki hosho since the first generation; the ninth is the son of the eighth, trained from childhood and has spent sixty years on this single paper.","ja":"「岩野市兵衛」は初代より生漉奉書に専心。九代目は八代目の子で幼少より父に師事、六十年余り奉書一筋。"},"works":{"zh":"越前生漉奉书——其毕生制品，用于神事仪礼、木版画与美术修复用纸；草间弥生木版画、现代浮世绘（攻壳机动队、电锯人）均指定用其纸。","en":"Echifen kizuki hosho — his life's product, used for Shinto ritual, woodblock and conservation paper; specified for Kusama Yayoi prints and modern ukiyo-e editions (Ghost in the Shell, Chainsaw Man).","ja":"越前生漉奉書——神事の儀礼用紙、木版画用紙、美術品修復用紙として愛用。草間彌生の木版画や現代の浮世絵（『攻殻機動隊』『チェンソーマン』）に指定使用。"}},
  {"id":"a-wajima-group","name":{"zh":"轮岛涂技术保存会","en":"Wajima-nuri Preservation Group","ja":"輪島塗技術保存会"},"craftId":"chu-wajima","specialty":{"zh":"轮岛涂（保持团体）","en":"Wajima-nuri (group)","ja":"輪島塗（保持団体）"},"born":null,"death":null,"year":1977,"group":true,"bio":{"zh":"石川县轮岛市漆器「轮岛涂」的重要无形文化财保持团体，1977年依文化财保护法获国家认定，长年致力于技艺保存与传承。轮岛涂以「布着せ」贴布加固与掺烧成硅藻土「轮岛地之粉」的厚层本坚地下地著称，工序逾百道，坚固耐久。","en":"The officially recognised holder-group for Wajima lacquerware of Wajima, Ishikawa; Wajima-nuri was designated an Important Intangible Cultural Property in 1977 and the Society certified as its holder, preserving the techniques since. Distinguished by nunokise cloth reinforcement and thick honkataji grounds with calcined diatomaceous 'Wajima jinoko', requiring over a hundred steps.","ja":"石川県輪島市の漆器「輪島塗」の重要無形文化財保持団体。1977年に輪島塗が重要無形文化財に指定され、その保持団体として認定、技の保存伝承に努める。布着せと焼成珪藻土「輪島地の粉」を用いた本堅地下地を特徴とし、工程は100以上。"},"lineage":{"zh":"轮岛涂采分工制，保存会分椀木地、曲物、指物、朴木地、髹漆、吕色、蒔绘、沈金八部门，由各工序顶尖职人师徒相传；现任会长浦出胜彦。","en":"Wajima-nuri uses division of labour; the Society mirrors this in eight sections (turning, bentwood, joinery, magnolia, lacquering, polishing, maki-e, chinkin), each led by top specialists transmitting skills master-to-apprentice; current chairman Urade Katsuhiko.","ja":"輪島塗は分業体制。保存会も椀木地・曲物・指物・朴木地・髹漆・呂色・蒔絵・沈金の8部門で構成され、各部門の第一線職人が徒弟制で伝承。現会長・浦出勝彦。"},"works":{"zh":"大型地球仪「夜之地球」（2017–2022，八部门共同制作，石川县轮岛漆艺美术馆常设，2025年大阪关西万博出展）；东京、北京、纽约、伦敦四城蒔绘画板。","en":"'Earth at Night' — a monumental globe made jointly by all eight sections (2017–2022, Ishikawa Wajima Museum of Urushi Art, shown at Expo 2025 Osaka); maki-e panels of Tokyo, Beijing, New York and London.","ja":"大型地球儀「夜の地球」（2017–2022年、8部門共同制作、石川県輪島漆芸美術館常設、2025年大阪・関西万博出展）。東京・北京・ニューヨーク・ロンドンの蒔絵パネル。"}}
];

const CENTROID={hokkaido:[645,150],tohoku:[582,300],kanto:[615,412],chubu:[522,425],kansai:[445,500],chugoku:[372,543],shikoku:[404,610],kyushu:[285,655],okinawa:[190,845]};
const CAT_ORDER=["陶瓷","染织","漆器","金工","木竹工艺","和纸","民族工艺","版画","文具","其他工艺"];
const CAT_TRANS={
  "陶瓷":{zh:"陶瓷",en:"Ceramics",ja:"陶磁器"},"染织":{zh:"染织",en:"Textile & Dyeing",ja:"染織"},
  "漆器":{zh:"漆器",en:"Lacquerware",ja:"漆器"},"金工":{zh:"金工",en:"Metalwork",ja:"金工"},
  "木竹工艺":{zh:"木竹工艺",en:"Wood & Bamboo",ja:"木竹工芸"},"和纸":{zh:"和纸",en:"Washi",ja:"和紙"},
  "民族工艺":{zh:"民族工艺",en:"Ethnic Craft",ja:"民族工芸"},"版画":{zh:"版画",en:"Woodblock Print",ja:"版画"},
  "文具":{zh:"文具",en:"Writing Tools",ja:"文房具"},
  "其他工艺":{zh:"其他工艺",en:"Other Crafts",ja:"その他工芸"}
};

const $=s=>document.querySelector(s);
const markersG=$("#markers"),listEl=$("#list"),metaEl=$("#meta"),searchEl=$("#search"),bannerEl=$("#banner");

// markers
Object.keys(REGIONS).forEach(id=>{
  const [cx,cy]=CENTROID[id];
  const n=CRAFTS.filter(c=>c.r===id).length;
  const g=document.createElementNS("http://www.w3.org/2000/svg","g");
  g.style.cursor="pointer";
  g.innerHTML=`<circle class="marker" data-region="${id}" cx="${cx}" cy="${cy}" r="7"></circle>`+(n>0?`<text class="count" x="${cx}" y="${cy+3}">${n}</text>`:"");
  g.addEventListener("click",()=>setRegion(id));
  markersG.appendChild(g);
});

function getFiltered(){
  let items=CRAFTS;
  if(activeArtisanId){const a=ARTISANS.find(x=>x.id===activeArtisanId);items=CRAFTS.filter(c=>c.id===a.craftId);}
  else{
    if(activeRegion!=="all")items=items.filter(c=>c.r===activeRegion);
    if(activeCat!=="all")items=items.filter(c=>c.cat.zh===activeCat);
  }
  if(query){
    const q=query.toLowerCase();
    items=items.filter(c=>[c.name.zh,c.name.en,c.name.ja,c.loc.zh,c.cat.zh,
      ...ARTISANS.filter(a=>a.craftId===c.id).flatMap(a=>[a.name.zh,a.name.en,a.name.ja,a.specialty.zh])]
      .join(" ").toLowerCase().includes(q));
  }
  return items;
}
function mapRegion(){
  if(activeArtisanId){const a=ARTISANS.find(x=>x.id===activeArtisanId);const c=CRAFTS.find(x=>x.id===a.craftId);return c?c.r:"all";}
  return activeRegion;
}
function buildChips(){
  const U=UI[LANG];
  const cr=$("#chips-region");cr.innerHTML="";
  [["all",U.all],...Object.keys(REGIONS).map(id=>[id,REGIONS[id][LANG]])].forEach(([id,label])=>{
    const b=document.createElement("button");b.className="chip"+((!activeArtisanId&&activeRegion===id)?" active":"");
    b.textContent=label;b.addEventListener("click",()=>setRegion(id));cr.appendChild(b);});
  const cc=$("#chips-cat");cc.innerHTML="";
  const cats=CAT_ORDER.filter(c=>CRAFTS.some(x=>x.cat.zh===c));
  [["all",U.all],...cats.map(c=>[c,CAT_TRANS[c][LANG]])].forEach(([id,label])=>{
    const b=document.createElement("button");b.className="chip"+((!activeArtisanId&&activeCat===id)?" active":"");
    b.textContent=label;b.addEventListener("click",()=>setCat(id));cc.appendChild(b);});
  const ca=$("#chips-artisan");ca.innerHTML="";
  [["all",U.all],...ARTISANS.map(a=>[a.id,a.name[LANG]])].forEach(([id,label])=>{
    const b=document.createElement("button");b.className="chip artisan"+((activeArtisanId===id)?" active":"");
    b.textContent=label;b.addEventListener("click",()=>setArtisan(id));ca.appendChild(b);});
}
function render(){
  const U=UI[LANG];let items=getFiltered();
  if(activeArtisanId){const a=ARTISANS.find(x=>x.id===activeArtisanId);
    bannerEl.innerHTML=`<span class="x" id="bx">${U.clear}</span><b>${a.name[LANG]}</b> — ${a.specialty[LANG]}${a.year?(a.group?U.yearG:U.year(a.year)):""}`;
    $("#bx").addEventListener("click",()=>setArtisan("all"));}else bannerEl.innerHTML="";
  if(activeArtisanId){const a=ARTISANS.find(x=>x.id===activeArtisanId);metaEl.innerHTML=U.art(a.name[LANG],items.length);}
  else if(activeRegion!=="all")metaEl.innerHTML=U.region(REGIONS[activeRegion][LANG],items.length);
  else if(activeCat!=="all")metaEl.innerHTML=U.cat(CAT_TRANS[activeCat][LANG],items.length);
  else metaEl.innerHTML=U.total(items.length);
  listEl.innerHTML="";
  if(items.length===0){listEl.innerHTML=`<div class="empty">${U.empty}</div>`;return;}
  items.forEach(c=>{
    const div=document.createElement("div");div.className="craft";
    const arts=ARTISANS.filter(a=>a.craftId===c.id);
    let artHtml="";
    if(arts.length)artHtml=`<div class="art">${U.artisans}`+arts.map(a=>`<span class="nm" data-a="${a.id}">${a.name[LANG]}</span>`).join("、")+`</div>`;
    let bioHtml="";
    if(activeArtisanId){const a=ARTISANS.find(x=>x.id===activeArtisanId);if(a.craftId===c.id)bioHtml=`<div class="bio">${a.name[LANG]} · ${a.specialty[LANG]}${a.year?(a.group?U.yearG:U.year(a.year)):""}</div>`;}
    div.innerHTML=`<div class="name">${c.name[LANG]}</div><span class="tag">${c.cat[LANG]}</span><span class="tag loc">${c.loc[LANG]}</span><div class="detail">${c.desc[LANG]}${bioHtml}${artHtml}</div>`;
    div.addEventListener("click",()=>div.classList.toggle("open"));
    div.querySelectorAll(".nm").forEach(nm=>nm.addEventListener("click",e=>{e.stopPropagation();setArtisan(nm.dataset.a);}));
    listEl.appendChild(div);
  });
}
function paintMap(){
  const mr=mapRegion();
  document.querySelectorAll(".region-shape,.region-label").forEach(el=>{
    const id=el.getAttribute("data-region");
    if(el.classList.contains("region-label")){el.textContent=REGIONS[id][LANG];return;}
    el.classList.toggle("active",mr!=="all"&&id===mr);
    el.classList.toggle("dim",mr!=="all"&&id!==mr);
  });
  document.querySelectorAll(".marker").forEach(m=>{
    const id=m.getAttribute("data-region");
    m.classList.toggle("active",mr!=="all"&&id===mr);
    m.classList.toggle("dim",mr!=="all"&&id!==mr);
  });
}
function setRegion(id){activeArtisanId=null;activeRegion=(activeRegion===id&&id!=="all")?"all":id;buildChips();paintMap();render();}
function setCat(id){activeArtisanId=null;activeCat=(activeCat===id&&id!=="all")?"all":id;buildChips();paintMap();render();}
function setArtisan(id){activeArtisanId=(activeArtisanId===id&&id!=="all")?null:(id==="all"?null:id);activeRegion="all";activeCat="all";buildChips();paintMap();render();}

// DATABASE
function renderDB(){
  const U=UI[LANG];
  $("#db-note").textContent=U.db_note;
  $("#th-craft").textContent=U.th_craft;$("#th-region").textContent=U.th_region;
  $("#th-pref").textContent=U.th_pref;$("#th-cat").textContent=U.th_cat;
  $("#th-mat").textContent=U.th_mat;$("#th-tech").textContent=U.th_tech;
  $("#db-search").placeholder=U.db_search;
  let rows=CRAFTS.slice();
  if(dbQuery){const q=dbQuery.toLowerCase();
    rows=rows.filter(c=>[c.name.zh,c.name.en,c.name.ja,c.loc.zh,c.cat.zh,c.mat.zh,c.tech.zh]
      .join(" ").toLowerCase().includes(q));}
  const body=$("#db-body");body.innerHTML="";
  rows.forEach((c,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td class="no">${i+1}</td><td class="name">${c.name[LANG]}</td>`+
      `<td>${REGIONS[c.r][LANG]}</td><td>${c.loc[LANG]}</td><td>${c.cat[LANG]}</td>`+
      `<td>${c.mat[LANG]}</td><td>${c.tech[LANG]}</td>`;
    body.appendChild(tr);
  });
  if(rows.length===0)body.innerHTML=`<tr><td colspan="7" class="empty">${U.empty}</td></tr>`;
}

// ARTISANS
function renderArt(){
  const U=UI[LANG];
  $("#art-note").textContent=U.art_note;
  const grid=$("#art-grid");grid.innerHTML="";
  ARTISANS.forEach(a=>{
    const c=CRAFTS.find(x=>x.id===a.craftId);
    const div=document.createElement("div");div.className="acard";
    const life=a.group?"":(a.born?(a.born+"–"+(a.death||U.alive)):"");
    const yr=a.year?(a.group?`<span class="yr grp">${U.yearG}</span>`:`<span class="yr">${U.year(a.year)}</span>`):"";
    const meta=c?c.name[LANG]:a.specialty[LANG];
    div.innerHTML=
      `<div class="ahead">`+
        `<div class="ainfo"><div class="nm">${a.name[LANG]}</div>`+
        `<div class="sp">${a.specialty[LANG]}</div>`+
        `<div class="meta">${meta}${life?` · ${life}`:""}</div></div>`+
        yr+`<span class="toggle">＋</span>`+
      `</div>`+
      `<div class="abody">`+
        `<div class="sec"><span class="lab">${U.a_bio}</span><p>${a.bio[LANG]}</p></div>`+
        `<div class="sec"><span class="lab">${U.a_lineage}</span><p>${a.lineage[LANG]}</p></div>`+
        `<div class="sec"><span class="lab">${U.a_works}</span><p>${a.works[LANG]}</p></div>`+
        `<button class="locbtn" type="button">${U.a_locate}</button>`+
      `</div>`;
    div.querySelector(".ahead").addEventListener("click",()=>{div.classList.toggle("open");});
    div.querySelector(".locbtn").addEventListener("click",e=>{
      e.stopPropagation();activeArtisanId=a.id;activeRegion="all";activeCat="all";buildChips();paintMap();render();showTab("map");
    });
    grid.appendChild(div);
  });
}

// TABS
function showTab(v){
  curView=v;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.view===v));
  document.querySelectorAll(".view").forEach(el=>el.classList.add("hidden"));
  $("#view-"+v).classList.remove("hidden");
}

function applyLang(){
  const U=UI[LANG];
  $("#t-zh").textContent=U.t_zh;$("#t-en").textContent=U.t_en;$("#t-ja").textContent=U.t_ja;
  searchEl.placeholder=U.search;
  $("#lbl-region").textContent=U.lbl_region;$("#lbl-cat").textContent=U.lbl_cat;$("#lbl-artisan").textContent=U.lbl_artisan;
  $("#tab-map").textContent=U.tab_map;$("#tab-db").textContent=U.tab_db;$("#tab-art").textContent=U.tab_art;
  $("#footer").textContent=U.footer;
  document.documentElement.lang=LANG==="zh"?"zh-Hans":LANG;
  document.querySelectorAll("#lang-switch button").forEach(b=>b.classList.toggle("active",b.dataset.lang===LANG));
  buildChips();paintMap();render();renderDB();renderArt();
}

document.querySelectorAll("#lang-switch button").forEach(b=>b.addEventListener("click",()=>{LANG=b.dataset.lang;applyLang();}));
searchEl.addEventListener("input",e=>{query=e.target.value.trim();render();});
$("#db-search").addEventListener("input",e=>{dbQuery=e.target.value.trim();renderDB();});
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>showTab(t.dataset.view)));

applyLang();
</script>
</body>
</html>
